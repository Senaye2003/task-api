services:
  - type: web
    name: task-api
    runtime: node
    rootDir: task-api-backend
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: task-api-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: "10000"

databases:
  - name: task-api-db
    plan: free
    region: oregon
    databaseName: tasks_db
    user: tasks_user
